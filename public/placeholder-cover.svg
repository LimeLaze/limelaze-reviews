<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="100%" stop-color="#161616" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#252525" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="376" height="576" rx="6" fill="none" stroke="#2e2e2e" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Center Decorative Controller Icon -->
  <g transform="translate(200, 270)">
    <circle r="64" fill="url(#accentGlow)" stroke="#383838" stroke-width="2" />
    
    <!-- Gamepad silhouette -->
    <path d="M -30,-10 C -38,-10 -44,-4 -44,8 C -44,22 -32,32 -22,30 C -16,28 -10,22 -6,22 C -2,22 2,22 6,22 C 10,22 16,28 22,30 C 32,32 44,22 44,8 C 44,-4 38,-10 30,-10 Z"
          fill="#181818" stroke="#4a4a4a" stroke-width="2" stroke-linejoin="round" />
    
    <!-- D-pad -->
    <path d="M -24,4 L -24,14 M -29,9 L -19,9" stroke="#666666" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Action buttons -->
    <circle cx="21" cy="6" r="2" fill="#777777" />
    <circle cx="27" cy="11" r="2" fill="#777777" />
    <circle cx="15" cy="11" r="2" fill="#777777" />
    <circle cx="21" cy="16" r="2" fill="#777777" />
  </g>

  <!-- Label -->
  <text x="200" y="380" fill="#777777" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="1.5" text-anchor="middle">
    GAME COVER
  </text>
  <text x="200" y="404" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="1" text-anchor="middle">
    2 : 3 RATIO
  </text>
</svg>
